<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>非线性区交互仿真</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#13161B;color:#EDE7DA;font-family:'Noto Sans SC',sans-serif;padding:20px}
h1{text-align:center;margin-bottom:20px;color:#54B7C4;font-size:1.5em}
.container{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.canvas-box{background:#1a1d23;border-radius:8px;padding:15px;flex:1;min-width:300px}
.controls{background:#1a1d23;border-radius:8px;padding:15px;min-width:280px}
label{display:block;margin:10px 0 5px;color:#54B7C4;font-size:0.9em}
input[type=range]{width:100%;accent-color:#54B7C4}
.value{text-align:right;color:#EF7440;font-size:0.85em;font-family:monospace}
canvas{width:100%;border-radius:4px}
.info{background:#1a1d23;border-radius:8px;padding:15px;margin-top:20px;font-size:0.9em;line-height:1.6}
.info b{color:#54B7C4}
</style>
</head>
<body>
<h1>🎛️ 非线性区交互仿真</h1>
<div class="container">
  <div class="canvas-box">
    <canvas id="cv" width="500" height="400"></canvas>
  </div>
  <div class="controls">
    <label>峰值侧偏角 α_peak (°) <span class="value" id="vap">8</span></label>
    <input type="range" id="ap" min="4" max="15" value="8" step="0.5">
    <label>最大侧向力 Fy_max (N) <span class="value" id="vfm">8000</span></label>
    <input type="range" id="fm" min="4000" max="12000" value="8000" step="500">
    <label>侧偏刚度 Cα (N/°) <span class="value" id="vca">1000</span></label>
    <input type="range" id="ca" min="500" max="2000" value="1000" step="50">
    <label>当前侧偏角 α (°) <span class="value" id="va">5</span></label>
    <input type="range" id="a" min="0" max="25" value="5" step="0.5">
    <label>垂直载荷 Fz (N) <span class="value" id="vfz">5000</span></label>
    <input type="range" id="fz" min="2000" max="8000" value="5000" step="200">
  </div>
</div>
<div class="info">
  <b>图表说明：</b>轮胎力曲线分三区：青色为线性区，黄色为过渡区，红色为饱和区。当前工作点用圆点标记。
</div>
<script>
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const pad={l:60,r:30,t:40,b:50};
const ids=['ap','fm','ca','a','fz'];
const vals=['vap','vfm','vca','va','vfz'];

function tireForce(alpha,peakAlpha,maxFy,ca){
  const x=alpha/peakAlpha;
  if(x<0.3)return ca*alpha;
  if(x<0.7)return ca*peakAlpha*0.3+maxFy*(x-0.3)/0.4*0.4;
  if(x<1)return maxFy*(0.7+(x-0.7)/0.3*0.3);
  return maxFy*Math.exp(-0.5*(x-1)*(x-1));
}

function draw(){
  ids.forEach((id,i)=>{
    document.getElementById(vals[i]).textContent=document.getElementById(id).value;
  });
  const peakAlpha=parseFloat(document.getElementById('ap').value);
  const maxFy=parseFloat(document.getElementById('fm').value);
  const ca=parseFloat(document.getElementById('ca').value);
  const curAlpha=parseFloat(document.getElementById('a').value);
  const fz=parseFloat(document.getElementById('fz').value);

  ctx.clearRect(0,0,W,H);

  // Grid
  ctx.strokeStyle='#333';
  ctx.lineWidth=1;
  for(let i=0;i<=5;i++){
    const x=pad.l+i*(W-pad.l-pad.r)/5;
    ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,H-pad.b);ctx.stroke();
    const y=pad.t+i*(H-pad.t-pad.b)/5;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
  }

  // Axes
  ctx.strokeStyle='#EDE7DA';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,H-pad.b);ctx.lineTo(W-pad.r,H-pad.b);
  ctx.stroke();

  // Labels
  ctx.fillStyle='#EDE7DA';
  ctx.font='12px sans-serif';
  ctx.textAlign='center';
  for(let i=0;i<=5;i++){
    ctx.fillText(i*5+'°',pad.l+i*(W-pad.l-pad.r)/5,H-pad.b+20);
  }
  ctx.fillText('侧偏角 α',W/2,H-10);

  const maxAlpha=25;
  const maxForce=maxFy*1.2;

  // Zones
  const xPeak=pad.l+(peakAlpha/maxAlpha)*(W-pad.l-pad.r);
  const xSat=pad.l+(peakAlpha*1.5/maxAlpha)*(W-pad.l-pad.r);

  ctx.fillStyle='rgba(84,183,196,0.1)';
  ctx.fillRect(pad.l,pad.t,xPeak-pad.l,H-pad.t-pad.b);
  ctx.fillStyle='rgba(251,191,36,0.1)';
  ctx.fillRect(xPeak,pad.t,xSat-xPeak,H-pad.t-pad.b);
  ctx.fillStyle='rgba(239,116,64,0.1)';
  ctx.fillRect(xSat,pad.t,W-pad.r-xSat,H-pad.t-pad.b);

  ctx.font='10px sans-serif';
  ctx.fillStyle='#54B7C4';
  ctx.fillText('线性区',pad.l+30,pad.t+15);
  ctx.fillStyle='#FBBF24';
  ctx.fillText('过渡区',xPeak+30,pad.t+15);
  ctx.fillStyle='#EF7440';
  ctx.fillText('饱和区',xSat+30,pad.t+15);

  // Tire curve
  ctx.strokeStyle='#EDE7DA';
  ctx.lineWidth=2;
  ctx.beginPath();
  let first=true;
  for(let i=0;i<=100;i++){
    const alpha=i*maxAlpha/100;
    const fy=tireForce(alpha,peakAlpha,maxFy,ca);
    const x=pad.l+(alpha/maxAlpha)*(W-pad.l-pad.r);
    const y=H-pad.b-(fy/maxForce)*(H-pad.t-pad.b);
    if(first){ctx.moveTo(x,y);first=false;}
    else ctx.lineTo(x,y);
  }
  ctx.stroke();

  // Current point
  const curFy=tireForce(curAlpha,peakAlpha,maxFy,ca);
  const xc=pad.l+(curAlpha/maxAlpha)*(W-pad.l-pad.r);
  const yc=H-pad.b-(curFy/maxForce)*(H-pad.t-pad.b);
  ctx.fillStyle='#FBBF24';
  ctx.beginPath();
  ctx.arc(xc,yc,6,0,Math.PI*2);
  ctx.fill();

  // Info
  ctx.fillStyle='#54B7C4';
  ctx.font='bold 12px sans-serif';
  ctx.textAlign='left';
  ctx.fillText('α='+curAlpha.toFixed(1)+'°  Fy='+curFy.toFixed(0)+'N  Fz='+fz+'N',pad.l+10,pad.t+20);
  ctx.fillText('μ_eff='+(curFy/fz).toFixed(3),pad.l+10,pad.t+35);
}

ids.forEach(id=>document.getElementById(id).addEventListener('input',draw));
draw();
</script>
</body>
</html>
